<title>SBEL — Field Activity</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#11141d; --panel:#181c27; --panel2:#1e2330; --line:#2a3040;
  --ink:#e8eaf0; --muted:#8b93a7; --accent:#7aa2f7;
  --signed:#4ec9a0; --visit:#e0af68; --declined:#f7768e; --absent:#9aa5b8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:15px/1.5 'Public Sans',system-ui,-apple-system,sans-serif;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:21px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px;font-family:'IBM Plex Mono',monospace}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}
button{font:inherit;font-size:13px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
       background:var(--panel2);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
/* daily update */
.upd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:22px}
.updhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.updhead b{font-size:15px}
.updhead input{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);
               background:var(--panel2);color:var(--ink);color-scheme:dark}
.upd textarea{width:100%;min-height:300px;font:13.5px/1.5 'IBM Plex Mono',monospace;color:var(--ink);
              background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px;resize:vertical}
.updbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.updbtns .primary{background:var(--accent);color:#0d1017;border:none;font-weight:600}
.updbtns a{text-decoration:none}
.copied{color:var(--signed);font-size:12.5px;align-self:center}
/* attendance */
.att{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.att table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.att th,.att td{padding:8px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.att th{font-weight:500;color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace}
.att .nm{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:600;padding-left:14px;
         font-size:13px;z-index:1}
.att .sum{font-family:'IBM Plex Mono',monospace;color:var(--muted)}
.att tr:last-child td{border-bottom:none}
.ck{display:inline-flex;width:24px;height:24px;border-radius:6px;align-items:center;justify-content:center;
    font-weight:700;font-size:13px}
.ck.y{background:#173a2e;color:var(--signed)}
.ck.n{background:#3a1c24;color:var(--declined)}
.ck.p{border:1px dashed var(--line);color:var(--muted)}
.ck.x{color:#3a4050}
/* totals */
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:22px}
.t{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.t .n{font-size:27px;font-weight:700;line-height:1.1;font-family:'IBM Plex Mono',monospace}
.t .l{font-size:11.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.t.s .n{color:var(--signed)} .t.v .n{color:var(--visit)}
.t.d .n{color:var(--declined)} .t.a .n{color:var(--absent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
   margin:26px 0 11px;font-weight:600}
/* intern cards */
.people{display:grid;gap:10px}
.p{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.p.stale{border-color:#5a3a44}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pname{font-weight:600;font-size:16px}
.pconv{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--signed)}
.pconv.zero{color:var(--muted)}
.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#222736;margin:11px 0 9px}
.bar i{display:block;height:100%}
.pmeta{display:flex;flex-wrap:wrap;gap:11px;font-size:12px;color:var(--muted);
       font-family:'IBM Plex Mono',monospace}
.pmeta b{color:var(--ink);font-weight:600}
.flag{margin-top:9px;font-size:12.5px;color:#f7a8b8;background:#2b1d24;
      border-radius:7px;padding:7px 10px}
/* daily chart */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.days{display:flex;align-items:flex-end;gap:10px;height:130px}
.day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.stack{width:100%;max-width:52px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.stack i{display:block;width:100%}
.dlab{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.dnum{font-size:12px;font-weight:600;font-family:'IBM Plex Mono',monospace}
/* feed */
.feed{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.e{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:flex-start}
.e:last-child{border-bottom:none}
.pill{font-size:10px;font-weight:600;padding:3px 7px;border-radius:5px;white-space:nowrap;
      font-family:'IBM Plex Mono',monospace;flex:none;margin-top:1px}
.pill.s{background:#173a2e;color:var(--signed)} .pill.v{background:#3a2f16;color:var(--visit)}
.pill.d{background:#3a1c24;color:var(--declined)} .pill.a{background:#252a36;color:var(--absent)}
.ebody{min-width:0;flex:1}
.ebiz{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emeta{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:2px}
.enote{font-size:13px;color:#b9c0d0;margin-top:5px;font-style:italic}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:13px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* gate */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
      padding:24px;z-index:50}
.gate[hidden]{display:none!important}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:360px;width:100%}
.gbox h2{margin:0 0 6px;font-size:17px;color:var(--ink);text-transform:none;letter-spacing:0}
.gbox p{margin:0 0 15px;color:var(--muted);font-size:13.5px}
.gbox input{width:100%;padding:11px;font:inherit;border-radius:8px;border:1px solid var(--line);
            background:var(--panel2);color:var(--ink);margin-bottom:11px}
.gbox button{width:100%;background:var(--accent);color:#0d1017;border:none;font-weight:600;padding:11px}
.err{color:var(--declined);font-size:13px;margin-top:9px}
.empty{color:var(--muted);padding:26px;text-align:center}
</style>

<div class="gate" id="gate" hidden>
  <div class="gbox">
    <h2>Field dashboard</h2>
    <p>Enter the read token. It stays on this device.</p>
    <input id="tok" type="password" placeholder="token" autocomplete="current-password">
    <button id="go">Open</button>
    <div class="err" id="err" hidden>That token was rejected.</div>
  </div>
</div>

<div class="wrap">
  <header>
    <div>
      <h1>SBEL <span>Field Activity</span></h1>
      <div class="sub" id="stamp">loading…</div>
    </div>
    <button id="refresh">Refresh</button>
  </header>
  <div id="update"></div>
  <div id="attend"></div>
  <div id="main"><div class="empty">Loading…</div></div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwh-tteELiEPeeXvzIl8PU2c91ClOd5prjQuhui1wx1ax5HitZVH3ZTECL3I3SYz8Gs/exec';
var TOK_KEY = 'sbel_dash_token';
var TOKEN = localStorage.getItem(TOK_KEY) || '';

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){
  return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]; }); };

var PILL = {'Signed up':'s','Visited':'v','Declined':'d','Owner absent':'a'};
var COLOUR = {s:'var(--signed)',v:'var(--visit)',d:'var(--declined)',a:'var(--absent)'};

function ago(iso){
  if(!iso) return 'never';
  var mins = Math.round((Date.now() - new Date(iso).getTime())/60000);
  if(mins < 1)   return 'just now';
  if(mins < 60)  return mins + 'm ago';
  var hrs = Math.round(mins/60);
  if(hrs < 24)   return hrs + 'h ago';
  return Math.round(hrs/24) + 'd ago';
}
function hoursSince(iso){
  return iso ? (Date.now() - new Date(iso).getTime())/3600000 : Infinity;
}
function dayLabel(d){
  var p = d.split('-');
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  return dt.toLocaleDateString('en-GB',{weekday:'short'}) + ' ' + (+p[2]);
}

function askToken(bad){
  $('gate').hidden = false;
  $('err').hidden = !bad;
  $('tok').focus();
}
$('go').onclick = function(){
  TOKEN = $('tok').value.trim();
  if(!TOKEN) return;
  localStorage.setItem(TOK_KEY, TOKEN);
  $('gate').hidden = true;
  load();
};
$('tok').addEventListener('keydown', function(e){ if(e.key==='Enter') $('go').click(); });
$('refresh').onclick = function(){ load(); };

/* JSONP, not fetch. Apps Script redirects /exec to googleusercontent.com and a
   cross-origin fetch following that redirect gets a 404 for any response with a
   real payload. A script tag follows the same redirect without complaint. */
var jsonpN = 0;
function jsonp(params, onData, onFail){
  var name = 'sbelCB' + (++jsonpN) + '_' + Date.now().toString(36);
  var tag = document.createElement('script');
  var done = false;

  var timer = setTimeout(function(){
    if(done) return;
    done = true; cleanup(); onFail();
  }, 25000);

  function cleanup(){
    clearTimeout(timer);
    try { delete window[name]; } catch(e){ window[name] = undefined; }
    if(tag.parentNode) tag.parentNode.removeChild(tag);
  }

  window[name] = function(d){
    if(done) return;
    done = true; cleanup(); onData(d);
  };

  tag.onerror = function(){
    if(done) return;
    done = true; cleanup(); onFail();
  };
  tag.src = API + '?' + params + '&callback=' + name + '&_=' + Date.now();
  document.head.appendChild(tag);
}

var ROSTER = null, SUMMARY = null;

function load(){
  if(!TOKEN){ askToken(false); return; }
  $('stamp').textContent = 'refreshing…';
  var pending = 2, failed = false;
  function done(){
    if(--pending) return;
    if(failed || !SUMMARY) return;
    render(SUMMARY);
    renderAttendance();
    renderUpdate(false);
  }
  jsonp('summary=1&token=' + encodeURIComponent(TOKEN),
    function(d){
      if(!d || d.ok === false){ failed = true; localStorage.removeItem(TOK_KEY); TOKEN=''; askToken(true); done(); return; }
      SUMMARY = d; done();
    },
    function(){
      failed = true;
      $('main').innerHTML = '<div class="empty">Could not reach the backend. '
        + 'Check the connection, or confirm the Apps Script is deployed, then refresh.</div>';
      $('stamp').textContent = 'offline';
      done();
    });
  // roster is optional: without it, attendance falls back to whoever has logged
  jsonp('roster=1&token=' + encodeURIComponent(TOKEN),
    function(r){ if(r && r.ok && r.interns) ROSTER = r.interns; done(); },
    function(){ done(); });
}

/* ---------- dates, always in IST: that is when the walking happens ---------- */
function istToday(){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
}
function addDays(ymd, n){
  var p = ymd.split('-'), t = Date.UTC(+p[0], +p[1]-1, +p[2]) + n*86400000;
  return new Date(t).toISOString().slice(0,10);
}
function dow(ymd){ var p = ymd.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay(); }
function niceDate(ymd){
  var p = ymd.split('-'), d = new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
}
function first(name){ return String(name||'').split(' ')[0]; }

/* Field interns only: staff (target 0) log visits but do not take attendance. */
function fieldTeam(){
  if(ROSTER && ROSTER.length){
    return ROSTER.filter(function(p){ return p.target > 0; })
                 .map(function(p){ return {name:p.name, start:p.start||''}; });
  }
  var seen = {};
  (SUMMARY.daily||[]).forEach(function(x){ Object.keys(x.perIntern||x.byIntern||{}).forEach(function(n){ seen[n]=1; }); });
  return Object.keys(seen).sort().map(function(n){ return {name:n, start:''}; });
}
function dayIndex(){
  var m = {};
  (SUMMARY.daily||[]).forEach(function(x){ m[x.day] = x; });
  return m;
}
function doorsFor(dayRec, name){
  if(!dayRec) return {doors:0, signedUp:0};
  if(dayRec.perIntern && dayRec.perIntern[name]) return dayRec.perIntern[name];
  var n = (dayRec.byIntern||{})[name] || 0;      // older backend: raw events only
  return {doors:n, signedUp:0};
}

/* ---------- attendance ---------- */
function renderAttendance(){
  var team = fieldTeam(), idx = dayIndex(), today = istToday();
  if(!team.length){ $('attend').innerHTML = ''; return; }

  var starts = team.map(function(p){ return p.start; }).filter(Boolean).sort();
  var logged = Object.keys(idx).sort();
  var from = starts[0] || logged[0] || today;
  var days = [];
  for(var d = from; d <= today && days.length < 60; d = addDays(d,1)) days.push(d);

  var h = '<h2>Attendance \u2014 active means at least one visit logged that day</h2><div class="att"><table><tr><th class="nm">Intern</th>';
  days.forEach(function(d){
    var p = d.split('-');
    h += '<th>'+niceDate(d).split(' ')[0]+'<br>'+(+p[2])+'</th>';
  });
  h += '<th>Days</th></tr>';

  team.forEach(function(p){
    var active = 0, expected = 0;
    h += '<tr><td class="nm">'+esc(first(p.name))+'</td>';
    days.forEach(function(d){
      var st = doorsFor(idx[d], p.name);
      if(p.start && d < p.start){ h += '<td><span class="ck x" title="not started">\u00b7</span></td>'; return; }
      if(st.doors > 0){
        active++; expected++;
        h += '<td><span class="ck y" title="'+st.doors+' doors, '+st.signedUp+' signed">\u2713</span></td>';
      } else if(d === today){
        h += '<td><span class="ck p" title="nothing logged yet today">\u2026</span></td>';
      } else {
        expected++;
        h += '<td><span class="ck n" title="no visits logged">\u2717</span></td>';
      }
    });
    h += '<td class="sum">'+active+'/'+expected+'</td></tr>';
  });
  h += '</table></div>';
  $('attend').innerHTML = h;
}

/* ---------- 9 PM message for Meghna ---------- */
var UPD_DATE = null, UPD_DIRTY = false;

function buildMessage(day){
  var team = fieldTeam(), idx = dayIndex(), rec = idx[day], t = SUMMARY.totals || {};
  var lines = [], doors = 0, signed = 0, activeCount = 0, onRoster = 0;
  var listed = {};

  team.forEach(function(p){
    if(p.start && day < p.start) return;
    onRoster++;
    var st = doorsFor(rec, p.name);
    listed[p.name] = 1;
    if(st.doors > 0) activeCount++;
    lines.push({name:p.name, doors:st.doors, signed:st.signedUp});
  });
  // staff who went out that day still count toward the day's numbers
  if(rec && rec.perIntern){
    Object.keys(rec.perIntern).forEach(function(n){
      if(!listed[n]) lines.push({name:n, doors:rec.perIntern[n].doors, signed:rec.perIntern[n].signedUp, staff:true});
    });
  }
  lines.forEach(function(l){ doors += l.doors; signed += l.signed; });
  // active interns, then the supervisor's own doors, then interns with nothing logged
  var rank = function(l){ return l.staff ? 1 : (l.doors > 0 ? 0 : 2); };
  lines.sort(function(a,b){ return rank(a)-rank(b) || b.signed-a.signed || b.doors-a.doors; });

  var pct = doors ? Math.round(signed/doors*100) : 0;
  var m = '*SBEL field update \u2014 ' + niceDate(day) + '*\n\n';
  m += 'Doors visited: ' + doors + '\n';
  m += 'Sign-ups: ' + signed + (doors ? ' (' + pct + '%)' : '') + '\n';
  m += 'Interns active: ' + activeCount + ' of ' + onRoster + '\n\n';
  lines.forEach(function(l){
    if(l.doors === 0){ if(!l.staff) m += first(l.name) + ' \u2014 not active\n'; return; }
    m += first(l.name) + (l.staff ? ' (supervisor)' : '') + ' \u2014 ' + l.doors + (l.doors===1?' door':' doors')
      +  (l.signed ? ', ' + l.signed + (l.signed===1?' sign-up':' sign-ups') : '') + '\n';
  });
  m += '\nCampaign so far: ' + (t.all||0) + ' businesses visited, ' + (t.signedUp||0) + ' signed up';
  return m;
}

function renderUpdate(force){
  var today = istToday();
  if(!UPD_DATE) UPD_DATE = today;
  var box = $('update');

  if(!box.firstChild){
    box.innerHTML =
      '<div class="upd"><div class="updhead"><b>Daily update for Meghna</b>'
      + '<input type="date" id="updDate"></div>'
      + '<textarea id="updText" spellcheck="false"></textarea>'
      + '<div class="updbtns">'
      +   '<button class="primary" id="updCopy">Copy message</button>'
      +   '<a id="updWa" target="_blank" rel="noopener"><button>Open in WhatsApp</button></a>'
      +   '<button id="updRegen">Regenerate</button>'
      +   '<span class="copied" id="updOk" hidden>Copied</span>'
      + '</div></div>';
    $('updDate').onchange = function(){ UPD_DATE = this.value || today; renderUpdate(true); };
    $('updText').oninput = function(){ UPD_DIRTY = true; syncWa(); };
    $('updRegen').onclick = function(){ renderUpdate(true); };
    $('updCopy').onclick = copyMessage;
  }
  $('updDate').value = UPD_DATE;
  $('updDate').max = today;

  // never overwrite a note typed into the box just because the page auto-refreshed
  if(force || !UPD_DIRTY){
    $('updText').value = buildMessage(UPD_DATE);
    UPD_DIRTY = false;
  }
  syncWa();
}
function syncWa(){
  $('updWa').href = 'https://wa.me/?text=' + encodeURIComponent($('updText').value);
}
function copyMessage(){
  var ta = $('updText'), ok = $('updOk');
  function shown(){ ok.hidden = false; setTimeout(function(){ ok.hidden = true; }, 1800); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(shown, fallback);
  } else fallback();
  function fallback(){ ta.focus(); ta.select(); try{ document.execCommand('copy'); shown(); }catch(e){} }
}

function render(d){
  var t = d.totals || {};
  $('stamp').textContent = 'updated ' + new Date(d.updated).toLocaleString('en-GB',
    {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

  var html = '';

  // totals
  html += '<div class="tot">'
       +  tile('s', t.signedUp, 'signed up')
       +  tile('v', t.visited, 'visited')
       +  tile('d', t.declined, 'declined')
       +  tile('a', t.absent, 'owner absent')
       +  tile('', t.all, 'doors logged')
       +  tile('', (t.all ? (t.signedUp/t.all*100).toFixed(1) : '0.0') + '%', 'conversion')
       +  '</div>';

  // per intern
  html += '<h2>By intern</h2><div class="people">';
  var people = (d.interns || []).filter(function(p){ return p.all > 0; });
  if(!people.length) html += '<div class="empty">Nothing logged yet.</div>';
  people.forEach(function(p){
    var conv = p.all ? (p.signedUp/p.all*100) : 0;
    var stale = hoursSince(p.last) > 24;
    html += '<div class="p'+(stale?' stale':'')+'">'
         +  '<div class="prow"><div class="pname">'+esc(p.intern)+'</div>'
         +  '<div class="pconv'+(conv?'':' zero')+'">'+conv.toFixed(0)+'%</div></div>'
         +  bar(p)
         +  '<div class="pmeta">'
         +    '<span><b>'+p.signedUp+'</b> signed</span>'
         +    '<span><b>'+p.visited+'</b> visited</span>'
         +    '<span><b>'+p.declined+'</b> declined</span>'
         +    '<span><b>'+p.absent+'</b> absent</span>'
         +    '<span><b>'+p.all+'</b> total</span>'
         +    '<span>last '+ago(p.last)+'</span>'
         +  '</div>'
         +  (stale ? '<div class="flag">No activity for over a day — worth a message.</div>' : '')
         +  '</div>';
  });
  html += '</div>';

  // daily
  var days = (d.daily || []).slice(-7);
  if(days.length){
    var val = function(x){ return x.doors != null ? x.doors : x.all; };
    var peak = Math.max.apply(null, days.map(val)) || 1;
    html += '<h2>Last '+days.length+' active days</h2><div class="chart"><div class="days">';
    days.forEach(function(x){
      var h = Math.max(6, Math.round(val(x)/peak*100));
      var sh = val(x) ? Math.round(Math.min(x.signedUp, val(x))/val(x)*h) : 0;
      html += '<div class="day">'
           +  '<div class="dnum">'+val(x)+'</div>'
           +  '<div class="stack" style="height:'+h+'px">'
           +    '<i style="height:'+(h-sh)+'px;background:var(--visit);opacity:.55"></i>'
           +    '<i style="height:'+sh+'px;background:var(--signed)"></i>'
           +  '</div>'
           +  '<div class="dlab">'+dayLabel(x.day)+'</div>'
           +  '</div>';
    });
    html += '</div><div class="legend">'
         +  '<span><i style="background:var(--signed)"></i>signed up</span>'
         +  '<span><i style="background:var(--visit);opacity:.55"></i>other doors</span>'
         +  '</div></div>';
  }

  // feed
  html += '<h2>Recent activity</h2><div class="feed">';
  var rec = d.recent || [];
  if(!rec.length) html += '<div class="empty">No events yet.</div>';
  rec.forEach(function(e){
    var k = PILL[e.status] || 'a';
    html += '<div class="e">'
         +  '<span class="pill '+k+'">'+esc(e.status||'?')+'</span>'
         +  '<div class="ebody">'
         +    '<div class="ebiz">'+esc(e.business)+'</div>'
         +    '<div class="emeta">'+esc(e.intern)+' · '+esc(e.zone)+' · '+ago(e.ts)+'</div>'
         +    (e.note ? '<div class="enote">'+esc(e.note)+'</div>' : '')
         +  '</div></div>';
  });
  html += '</div>';

  $('main').innerHTML = html;
}

function tile(cls, n, label){
  return '<div class="t '+cls+'"><div class="n">'+(n==null?0:n)+'</div><div class="l">'+label+'</div></div>';
}
function bar(p){
  var segs = [['s',p.signedUp],['v',p.visited],['d',p.declined],['a',p.absent]];
  var tot = p.all || 1;
  return '<div class="bar">' + segs.map(function(x){
    return x[1] ? '<i style="width:'+(x[1]/tot*100)+'%;background:'+COLOUR[x[0]]+'"></i>' : '';
  }).join('') + '</div>';
}

if(!TOKEN) askToken(false); else load();
setInterval(function(){ if(TOKEN && !document.hidden) load(); }, 120000);
</script>
